<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на стрижку</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <div class="page-content">
        <h1>Запись на услугу</h1>

        <div class="form-group">
            <label for="date">Выберите дату:</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label>Выберите время:</label>
            <div id="timeSlots" class="time-slots"></div>
        </div>

        <div class="form-group">
            <div class="service-info">
                <label>Услуга:</label>
                <span id="serviceName"></span>
                <label style="margin-top: 8px;">Цена:</label>
                <span id="servicePrice"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Ваше имя:</label>
            <input type="text" id="userName" required>

            <label>Телефон:</label>
            <input type="tel" id="userPhone" required>
        </div>

        <div class="form-group">
            <label>Адрес оказания услуги:</label>
            <div class="address-info">
                <p><span id="address"></span></p>
            </div>
        </div>

        <button id="submitBtn">Записаться</button>
        <div id="status"></div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
